<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="t d"><title id="t">潛熱未決卡</title><desc id="d">冰正在融化，吸熱箭頭持續進入，溫度計讀值卻暫時不升；卡片標示此現象不由鑽炮實驗解決。</desc>
<rect width="1200" height="750" fill="#e9ddbd"/><rect x="38" y="38" width="1124" height="674" rx="18" fill="none" stroke="#5f4632" stroke-width="5"/>
<text x="80" y="110" font-family="serif" font-size="48" fill="#3b2a20">未查現象不能被反例抹掉</text>
<path d="M160 250h280l-50 250H210z" fill="#b9d9df" stroke="#426875" stroke-width="8"/><path d="M230 230l70-85 72 85z" fill="#e8f4f4" stroke="#426875" stroke-width="7"/>
<path d="M570 220v250" stroke="#8d332b" stroke-width="18"/><path d="M520 270l50-60 50 60" fill="none" stroke="#8d332b" stroke-width="18"/><text x="520" y="530" font-family="sans-serif" font-size="34" fill="#8d332b">持續吸熱</text>
<rect x="730" y="180" width="90" height="330" rx="45" fill="#f2eee3" stroke="#3e4f54" stroke-width="8"/><rect x="760" y="310" width="30" height="170" rx="15" fill="#b74836"/><text x="850" y="330" font-family="sans-serif" font-size="36" fill="#3b2a20">溫度暫停</text><text x="850" y="390" font-family="sans-serif" font-size="30" fill="#6e5744">相變仍在進行</text>
<path d="M120 615h960" stroke="#9b633b" stroke-width="3"/><text x="600" y="665" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#3b2a20">邊界：鑽炮反例不替運動說解釋這張卡</text></svg>
