<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="t d"><title id="t">T1 同尺量熱</title><desc id="d">等重同溫的金屬碎屑與實心薄片分別放入等量同溫水中，兩條回溫曲線近似重合。</desc>
<rect width="1200" height="750" fill="#e9ddbd"/><rect x="38" y="38" width="1124" height="674" rx="18" fill="none" stroke="#5f4632" stroke-width="5"/>
<text x="80" y="110" font-family="serif" font-size="48" fill="#3b2a20">T1｜碎屑與薄片放上同一把熱尺</text>
<g stroke="#4d7180" stroke-width="8" fill="#b9d9df"><path d="M120 230h300l-35 250H155z"/><path d="M465 230h300l-35 250H500z"/></g>
<g fill="#777" stroke="#333" stroke-width="5"><circle cx="225" cy="330" r="22"/><circle cx="270" cy="385" r="18"/><circle cx="320" cy="320" r="20"/><rect x="565" y="300" width="110" height="110" rx="7"/></g>
<text x="270" y="540" text-anchor="middle" font-family="sans-serif" font-size="28">等重碎屑</text><text x="615" y="540" text-anchor="middle" font-family="sans-serif" font-size="28">等重薄片</text>
<path d="M820 490V210M820 490h270" stroke="#40362d" stroke-width="6"/><path d="M835 450C900 390 940 300 1070 250" fill="none" stroke="#a44d35" stroke-width="12"/><path d="M835 455C900 395 940 305 1070 255" fill="none" stroke="#305f78" stroke-width="7" stroke-dasharray="18 13"/>
<text x="955" y="555" text-anchor="middle" font-family="sans-serif" font-size="30">兩條曲線近似重合</text><text x="600" y="665" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#3b2a20">碎屑沒有顯示出足以供應本輪熱量的較低熱容量</text></svg>
