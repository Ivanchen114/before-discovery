<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="t d"><title id="t">T3 密合對照</title><desc id="d">開放進氣與扣緊皮圈的兩組裝置並排，兩條乾淨升溫曲線近似重合，舊空氣來源封條保留斜線。</desc>
