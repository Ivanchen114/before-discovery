<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
  <title id="t">四份來源預測逐一對帳</title>
  <desc id="d">碎屑、炮身、空氣與水四份原預測帶都保留在卷宗；本摘要不預畫玩家選定的終點位置或封條裂否，須展開本局卷宗逐張查驗。</desc>
  <rect width="1200" height="750" fill="#e9ddbd"/>
  <rect x="38" y="38" width="1124" height="674" rx="18" fill="none" stroke="#5f4632" stroke-width="5"/>
  <text x="80" y="110" font-family="serif" font-size="48" fill="#3b2a20">四份來源預測逐一對帳</text>
  <text x="82" y="148" font-family="sans-serif" font-size="21" fill="#6a513d">長時段曲線走完後，原帶與封條仍留在各自卷袋，狀態可追查。</text>

  <g font-family="sans-serif" fill="#3b2a20">
    <g transform="translate(84 190)">
      <rect width="470" height="104" rx="12" fill="#d6bd8d" stroke="#76583f" stroke-width="3"/>
      <path d="M20 24h430v58H20z" fill="#eadfc5" stroke="#9b7d58" stroke-width="2"/>
      <text x="42" y="61" font-size="27" font-weight="700">碎屑</text>
      <text x="165" y="61" font-size="22">原預測帶保留</text>
    </g>
    <g transform="translate(84 316)">
      <rect width="470" height="104" rx="12" fill="#d6bd8d" stroke="#76583f" stroke-width="3"/>
      <path d="M20 24h430v58H20z" fill="#eadfc5" stroke="#9b7d58" stroke-width="2"/>
      <text x="42" y="61" font-size="27" font-weight="700">炮身</text>
      <text x="165" y="61" font-size="22">原預測帶保留</text>
    </g>
    <g transform="translate(84 442)">
      <rect width="470" height="104" rx="12" fill="#d6bd8d" stroke="#76583f" stroke-width="3"/>
      <path d="M20 24h430v58H20z" fill="#eadfc5" stroke="#9b7d58" stroke-width="2"/>
      <text x="42" y="61" font-size="27" font-weight="700">空氣</text>
      <text x="165" y="61" font-size="22">原預測帶保留</text>
    </g>
    <g transform="translate(84 568)">
      <rect width="470" height="104" rx="12" fill="#d6bd8d" stroke="#76583f" stroke-width="3"/>
      <path d="M20 24h430v58H20z" fill="#eadfc5" stroke="#9b7d58" stroke-width="2"/>
      <text x="42" y="61" font-size="27" font-weight="700">水</text>
      <text x="165" y="61" font-size="22">原預測帶保留</text>
    </g>
  </g>

  <g transform="translate(620 190)">
    <path d="M0 300h472M0 300V24" fill="none" stroke="#40362d" stroke-width="5"/>
    <path d="M18 286C118 260 190 224 270 180S390 102 454 54" fill="none" stroke="#a44d35" stroke-width="14"/>
    <text x="236" y="340" text-anchor="middle" font-family="serif" font-size="29" fill="#3b2a20">長時段升溫線</text>
    <rect x="28" y="365" width="420" height="85" rx="12" fill="#d6c49e" stroke="#76583f" stroke-width="3"/>
    <text x="238" y="400" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3b2a20">終點位置、封條裂否</text>
    <text x="238" y="430" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3b2a20">展開本局卷宗逐張查驗</text>
  </g>

</svg>
