<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="t d"><title id="t">共同驗證頁</title><desc id="d">共同頁分操作、讀數、熱質說解讀與運動說解讀四欄；底部保留範圍未決與兌換率未量得，四方各簽自己負責的欄。</desc>
<rect width="1200" height="750" fill="#e9ddbd"/><rect x="38" y="38" width="1124" height="674" rx="18" fill="none" stroke="#5f4632" stroke-width="5"/>
<text x="80" y="105" font-family="serif" font-size="48" fill="#3b2a20">一頁四種署名、兩筆未決</text>
<g fill="#f4ecd7" stroke="#6d513a" stroke-width="4"><rect x="80" y="150" width="250" height="320"/><rect x="340" y="150" width="250" height="320"/><rect x="600" y="150" width="250" height="320"/><rect x="860" y="150" width="250" height="320"/></g>
<g font-family="sans-serif" text-anchor="middle" fill="#3b2a20"><text x="205" y="200" font-size="30">操作</text><text x="465" y="200" font-size="30">讀數</text><text x="725" y="200" font-size="30">熱質說欄</text><text x="985" y="200" font-size="30">運動說欄</text><text x="205" y="420" font-size="25">史坦格署名</text><text x="465" y="420" font-size="25">凱斯勒署名</text><text x="725" y="420" font-size="25">凱斯勒署名</text><text x="985" y="420" font-size="25">朗福德署名</text></g>
<g font-family="sans-serif" font-size="30"><rect x="120" y="520" width="430" height="85" fill="#d7c69e"/><rect x="650" y="520" width="430" height="85" fill="#d7c69e"/><text x="155" y="575">範圍：未決</text><text x="685" y="575">兌換率：未量得</text></g>
<text x="600" y="675" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#3b2a20">旅人只在最後交棒一次署名；不替任何個人理論背書</text></svg>
